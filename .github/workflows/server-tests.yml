name: Server tests

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

# A newer push to the same PR/branch supersedes the running job.
concurrency:
  group: server-tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Node-side tests of the MCP server itself (tool registration, schema/plugin
  # drift, per-tool contract tests with a fake Revit client, socket layer
  # against a fake plugin, utils, sql.js store). No Revit needed, so these run
  # on hosted runners on every PR and push.
  server-tests:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: server/package-lock.json

      - name: Install, typecheck and test
        working-directory: server
        # bash (-e) on both OSes: a multi-line pwsh step only fails on the
        # exit code of its LAST command, which would hide a build:check failure.
        shell: bash
        run: |
          npm ci
          npm run build:check
          npm test
